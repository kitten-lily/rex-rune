name: Binary release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Native build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config dpkg-dev desktop-file-utils libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libegl1-mesa-dev libgl1-mesa-dev libvulkan-dev mesa-vulkan-drivers
      - uses: jdx/mise-action@v2
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Formatting, lint, and tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
          cargo test --manifest-path vendor/rexrs/Cargo.toml --all-features
      - name: Build
        run: cargo build --locked --release --bin rex-linux
      - name: Package
        run: |
          python3 scripts/package-release.py --deb
          desktop-file-validate resources/dev.shuv.rex-linux.desktop
      - name: Test packaged install without touching the runner's real home
        run: |
          mkdir -p "$RUNNER_TEMP/package-test"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/package-test"
          package=$(find "$RUNNER_TEMP/package-test" -mindepth 1 -maxdepth 1 -type d)
          export HOME="$RUNNER_TEMP/install-test"
          export XDG_DATA_HOME="$HOME/.local/share"
          export XDG_BIN_HOME="$HOME/.local/bin"
          mkdir -p "$HOME"
          bash "$package/install.sh"
          cmp target/release/rex-linux "$XDG_BIN_HOME/rex-linux"
          "$XDG_BIN_HOME/rex-linux" --version
          desktop-file-validate "$XDG_DATA_HOME/applications/dev.shuv.rex-linux.desktop"
          bash "$package/scripts/install-desktop.sh" --uninstall
          test ! -e "$XDG_BIN_HOME/rex-linux"
          dpkg-deb --info dist/*.deb
          sudo apt-get install -y ./dist/*.deb
          /usr/bin/rex-linux --version
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum *.tar.gz *.deb > SHA256SUMS
          cat > RELEASE-NOTES.md <<'EOF'
          First prebuilt Linux release. No application behavior changes since v0.3.1.

          **Downloads:** `x86_64` / `amd64` for Intel/AMD; `aarch64` / `arm64` for ARM64.
          - **Debian/Ubuntu:** `sudo apt install ./rex-linux_*.deb` (choose your architecture).
          - **Other Linux:** extract the matching `.tar.gz` and run `bash install.sh` inside it. No root needed; requires `desktop-file-utils`.
          - Verify downloads with `sha256sum --ignore-missing -c SHA256SUMS`.

          Built natively on Ubuntu 24.04; requires glibc 2.39 or newer, graphics drivers, fontconfig, xkbcommon, and Wayland/X11 libraries. These are dynamically linked builds, not self-contained AppImages. See the bundled README for dependencies and installation.

          Requires an existing Rex server with API revision 10 or 11. Installing the client does not start, stop, or modify a Rex server.
          EOF
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Rex Linux ${GITHUB_REF_NAME#v}" --notes-file RELEASE-NOTES.md
          gh release upload "$GITHUB_REF_NAME" *.tar.gz *.deb SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
