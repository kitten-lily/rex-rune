[tools]
rust = { version = "1.96.1", components = "clippy,rustfmt" }
zig = "0.17.1"

# Records REX_CHROME in a file the build watches, so changing it rebuilds; the file only
# changes when the chrome does.
[tasks.chrome]
description = "Record the chrome (REX_CHROME) the next build uses"
hide = true
run = 'mkdir -p target && c="${REX_CHROME:-midnight}" && { [ "$(cat target/.rex-chrome 2>/dev/null)" = "$c" ] || printf "%s" "$c" > target/.rex-chrome; }'

[tasks.build]
description = "Build the release application (optional REX_CHROME)"
depends = ["chrome"]
run = "cargo build --locked --release --bin rex-linux && touch target/release/.rex-linux-build.stamp"
sources = [
    "Cargo.toml",
    "Cargo.lock",
    "build.rs",
    "target/.rex-chrome",
    "src/**/*",
    "resources/icons/256x256/apps/dev.shuv.rex-linux.png",
    "vendor/rune/crates/{rune,rune-motion,rune-staging,procwatch}/Cargo.toml",
    "vendor/rune/crates/{rune,rune-motion,rune-staging,procwatch}/src/**/*",
    "vendor/rune/crates/rune/assets/**/*",
    "vendor/rexrs/Cargo.toml",
    "vendor/rexrs/src/**/*",
]
outputs = ["target/release/rex-linux", "target/release/.rex-linux-build.stamp"]

[tasks.install]
description = "Build and install Rex Linux for the current user (optional REX_INSTALL_FONT)"
depends = ["build"]
run = "bash scripts/install-user.sh install"

[tasks.uninstall]
description = "Remove the current user's Rex Linux installation"
run = "bash scripts/install-user.sh uninstall"

[tasks.test]
description = "Run unit and headless UI tests"
run = "cargo test --locked --all-features"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.clippy]
description = "Lint every target and feature"
run = "cargo clippy --locked --all-targets --all-features -- -D warnings"

[tasks."test-rexrs"]
description = "Test the vendored Rex SDK"
run = "cargo test --manifest-path vendor/rexrs/Cargo.toml --all-features"

[tasks.check]
description = "Run all repository checks"
run = """
cargo fmt --all -- --check
cargo clippy --locked --all-targets --all-features -- -D warnings
cargo test --locked --all-features
cargo test --manifest-path vendor/rexrs/Cargo.toml --all-features
"""
