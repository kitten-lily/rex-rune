[tools]
rust = { version = "1.96.1", components = "clippy,rustfmt" }
zig = "0.17.1"

[tasks.fetch-dracula-pro]
description = "Fetch Dracula Pro Ghostty themes (licensees; uses your GitHub credentials)"
run = "bash scripts/fetch-dracula-pro.sh"

[tasks.build]
description = "Build the release application"
depends = ["fetch-dracula-pro"]
run = "cargo build --locked --release --bin rex-linux && touch target/release/.rex-linux-build.stamp"

[tasks.install]
description = "Build Rex Linux and install it with a launcher for the current user"
depends = ["build"]
run = "bash scripts/install-desktop.sh --copy"

[tasks.uninstall]
description = "Remove the current user's Rex Linux installation"
run = "bash scripts/install-desktop.sh --uninstall"

[tasks.test]
description = "Run unit and headless UI tests"
run = "cargo test --locked --all-features"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.clippy]
description = "Lint every target and feature"
run = "cargo clippy --locked --all-targets --all-features -- -D warnings"

[tasks."test-rexrs"]
description = "Test the vendored Rex SDK"
run = "cargo test --manifest-path vendor/rexrs/Cargo.toml --all-features"

[tasks.check]
description = "Run all repository checks"
run = """
cargo fmt --all -- --check
cargo clippy --locked --all-targets --all-features -- -D warnings
cargo test --locked --all-features
cargo test --manifest-path vendor/rexrs/Cargo.toml --all-features
python3 scripts/test-fetch-dracula-pro.py
REX_DRACULA_PRO_DIR=$PWD/tests/fixtures/dracula-pro cargo clippy --locked --all-targets --all-features -- -D warnings
REX_DRACULA_PRO_DIR=$PWD/tests/fixtures/dracula-pro cargo test --locked --all-features
"""
